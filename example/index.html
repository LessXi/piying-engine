<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>皮影戏引擎 · piying-engine 示例</title>
<style>
  html,body{margin:0;height:100%;background:#050301;color:#e8d6b4;
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
  #wrap{position:relative;line-height:0;box-shadow:0 0 70px 10px rgba(255,150,50,.09),0 24px 60px -12px #000}
  canvas{display:block;border-radius:4px;background:#000}
  #bar{display:flex;align-items:center;gap:12px;font-size:12px;color:#b99a6d;width:min(92vw,900px)}
  #bar button{font:inherit;cursor:pointer;color:#ffd9a0;background:rgba(255,170,80,.08);
    border:1px solid rgba(255,180,90,.28);border-radius:999px;padding:4px 14px}
  #bar button:hover{background:rgba(255,170,80,.2)}
  #scrub{flex:1}
  code{color:#ffd9a0;background:rgba(255,170,80,.1);padding:1px 5px;border-radius:3px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="bar">
  <button id="play">▶ 播放</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="clock">0.0s</span>
</div>

<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js" } }
</script>
<script type="module">
// ============================================================================
// piying-engine 最小示例：用引擎的公开 API 从零拼一个会动的小人，演一段循环动作。
//
// 全程没有使用造型图纸（src/content/）—— 只用 makeAlphaFromDraw 现画几个部件，
// 再交给 Rig 装配、交给 ShadowStage 投影。这就是"接自己的内容"的完整流程。
// ============================================================================
import * as THREE from '../vendor/three.module.js';
import { Renderer } from '../src/engine/renderer.js';
import { Stage } from '../src/engine/stage.js';
import { WaveScreen } from '../src/engine/screen.js';
import { Rig } from '../src/engine/rig.js';
import { makeFabricTexture, makeAlphaFromDraw } from '../src/engine/textures.js';

/* ------------------------------------------------------------------ *
 * 1. 渲染器 + 舞台 + 幕布（固定装配顺序，照着抄即可）
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('c');
const renderer = new Renderer(canvas, { width: 960, height: 540, pixelRatio: 1 });

const SCREEN_W = 4.0, SCREEN_H = 2.5;
const stage = new Stage({ screenWidth: SCREEN_W, screenHeight: SCREEN_H });
renderer.scene.add(stage.group);

const fabric = makeFabricTexture(1024);
const screen = new WaveScreen({ width: SCREEN_W, height: SCREEN_H, segX: 140, segY: 90, fabric });
screen.bindRenderer(renderer);            // 必须传 three 的 WebGLRenderer（或含 .renderer 的包装类）
renderer.scene.add(screen.mesh);
screen.attachLight(stage.light, { lightFar: 12, shadowSize: 2048, clothDiffusion: 0.062 });

/* ------------------------------------------------------------------ *
 * 2. 画部件：一个深色的"实体"轮廓，孔洞用 destination-out 挖掉
 *
 *    约定：遮罩上画到的 = 皮影实体；挖掉的 = 镂空（光会从那里穿过去）
 * ------------------------------------------------------------------ */
function disc(cx, cy, r) {
  return (ctx) => { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); };
}

// 躯干（带一排镂空鳞片）
const torsoTex = makeAlphaFromDraw((ctx, w, h) => {
  ctx.beginPath();
  ctx.moveTo(w * 0.30, h * 0.98); ctx.lineTo(w * 0.34, h * 0.16);
  ctx.lineTo(w * 0.66, h * 0.16); ctx.lineTo(w * 0.70, h * 0.98);
  ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(w * 0.50, h * 0.12, w * 0.20, 0, Math.PI * 2); ctx.fill(); // 领口
  for (let r = 0; r < 6; r++) {
    for (let c = 0; c < 5; c++) {
      ctx.beginPath();
      ctx.arc(w * (0.36 + c * 0.07) + (r % 2) * 0.035 * w, h * (0.26 + r * 0.10), w * 0.023, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}, { w: 256, h: 320, baseColor: '#1b0d06', glow: 0.55 });

// 头（圆头 + 镂空髻）；把圆的底边贴近贴图底边，铰链 P(h) 就能落在脖子上
const headTex = makeAlphaFromDraw((ctx, w, h) => {
  ctx.beginPath(); ctx.arc(w * 0.5, h * 0.62, w * 0.38, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(w * 0.5, h * 0.06); ctx.lineTo(w * 0.74, h * 0.34); ctx.lineTo(w * 0.5, h * 0.40); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(w * 0.64, h * 0.80, w * 0.11, 0, Math.PI * 2); ctx.fill();  // 嘴/胡
  ctx.beginPath(); ctx.arc(w * 0.30, h * 0.16, w * 0.09, 0, Math.PI * 2); ctx.fill();  // 髻孔
  ctx.globalCompositeOperation = 'source-over';
}, { w: 200, h: 200, baseColor: '#1b0d06', glow: 0.6 });

// 四肢用同一张"胶囊"：宽端在**上**（贴着关节），窄端朝下。
// 注意：四肢上不要再挖大孔 —— 挖了会把关节处打断，影子变成一段一段的虚线。
const limbTex = makeAlphaFromDraw((ctx, w, h) => {
  ctx.beginPath();
  ctx.moveTo(w * 0.26, h); ctx.lineTo(w * 0.26, h * 0.18);
  ctx.quadraticCurveTo(w * 0.5, h * 0.01, w * 0.74, h * 0.18);
  ctx.lineTo(w * 0.74, h); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'destination-out';
  // 只在**下端**点一个小孔，作为"袖口/裤脚"的透光细节
  ctx.beginPath(); ctx.arc(w * 0.5, h * 0.88, w * 0.10, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}, { w: 96, h: 200, baseColor: '#1b0d06', glow: 0.45 });

/* ------------------------------------------------------------------ *
 * 3. 装配关节树
 *
 *    addPart 的坐标约定（这两个参数最容易搞反，务必理解）：
 *
 *      pivot [px,py] —— 关节在【自己贴图】里的位置，坐标以贴图中心为原点。
 *                       顶点会平移 -pivot，所以铰链在部件"顶端"就写 [0, +h/2]，
 *                       在"底端"就写 [0, -h/2]。绕 pivot 旋转 = 绕这个关节摆动。
 *      anchor [ax,ay] —— 关节在【父件 pivot 坐标系】里的位置。
 *                       所以"挂在父件顶端"就写 [·, +父高]。
 *
 *    ★ 躯干链条要**向上长**：root 放在胯部，waist 的铰链在它底端（pivot [0,-h/2]），
 *      chest 挂在 waist 顶端、铰链也在它底端……这样头才会在最上面。
 *      如果躯干统一把铰链放顶端、又向下堆叠，整个人会从 root 往下堆，头会跑到腰的位置。
 *      四肢相反：从肩/胯"往下长"，所以铰链取顶端（用 P()）。
 *
 *    尺寸参考：幕布 4.0 × 2.5 m，人高约 1.5 m（占幕布 60%）比较好看。
 * ------------------------------------------------------------------ */
const rig = new Rig({ lightFar: 12 });
// 比例按"可读的剪影"来定，不是按解剖学：
// 躯干短而宽、头大、四肢粗而短 —— 影子缩小到幕布上才认得出是个人。
const TORSO_H = 0.30, TORSO_W = 0.34, HEAD_H = 0.32, NECK = 0.06;
const UPPER = 0.20, LOWER = 0.17;      // 上臂 / 前臂
const THIGH = 0.27, SHIN = 0.24, FOOT = 0.09;
const HIP = 0.06;                      // 胯关节块高度（短！长了会在胯部露缝）
const P = (h) => [0, h / 2];           // 四肢：铰链在顶端（向下长）
const B = (h) => [0, -h / 2];          // 躯干：铰链在底端（向上长）

// —— 躯干：胯(root) → 腰 → 胸 → 脖 → 头
rig.addPart({ key: 'waist', tex: torsoTex, w: TORSO_W, h: TORSO_H, anchor: [0, 0], pivot: B(TORSO_H) });
rig.addPart({ key: 'chest', tex: torsoTex, w: TORSO_W, h: TORSO_H, parent: 'waist', anchor: [0, TORSO_H], pivot: B(TORSO_H), z: 0.004 });
rig.addPart({ key: 'neck', tex: limbTex, w: 0.10, h: NECK, parent: 'chest', anchor: [0, TORSO_H], pivot: B(NECK), z: 0.005 });
rig.addPart({ key: 'head', tex: headTex, w: 0.34, h: HEAD_H, parent: 'neck', anchor: [0, NECK], pivot: B(HEAD_H), z: 0.006 });

// —— 手臂：肩 → 上臂 → 前臂 → 手（从肩往下长）
for (const [s, side, sx] of [['L', 'upperArmL', -1], ['R', 'upperArmR', 1]]) {
  rig.addPart({ key: `shoulder${s}`, tex: limbTex, w: 0.13, h: 0.11, parent: 'chest', anchor: [sx * 0.17, TORSO_H - 0.04], pivot: P(0.11) });
  rig.addPart({ key: side, tex: limbTex, w: 0.105, h: UPPER, parent: `shoulder${s}`, anchor: [0, -0.11], pivot: P(UPPER) });
  rig.addPart({ key: `forearm${s}`, tex: limbTex, w: 0.09, h: LOWER, parent: side, anchor: [0, -UPPER], pivot: P(LOWER) });
  rig.addPart({ key: `hand${s}`, tex: limbTex, w: 0.075, h: 0.11, parent: `forearm${s}`, anchor: [0, -LOWER], pivot: P(0.11) });
}

// —— 腿：胯 → 大腿 → 小腿 → 脚（从胯往下长）
for (const [s, side, sx] of [['L', 'thighL', -1], ['R', 'thighR', 1]]) {
  rig.addPart({ key: `hip${s}`, tex: limbTex, w: 0.13, h: HIP, parent: 'waist', anchor: [sx * 0.08, 0], pivot: P(HIP) });
  rig.addPart({ key: side, tex: limbTex, w: 0.11, h: THIGH, parent: `hip${s}`, anchor: [0, -HIP], pivot: P(THIGH) });
  rig.addPart({ key: `shin${s}`, tex: limbTex, w: 0.095, h: SHIN, parent: side, anchor: [0, -THIGH], pivot: P(SHIN) });
  rig.addPart({ key: `foot${s}`, tex: limbTex, w: 0.085, h: FOOT, parent: `shin${s}`, anchor: [0, -SHIN], pivot: P(FOOT) });
}

// 一层更远的"随从"，用来演示层叠：离灯更近 → 影更大更虚
const far = new Rig({ lightFar: 12 });
far.addPart({ key: 'waist', tex: torsoTex, w: TORSO_W, h: TORSO_H, anchor: [0, 0], pivot: B(TORSO_H) });
far.addPart({ key: 'head', tex: headTex, w: 0.34, h: HEAD_H, parent: 'waist', anchor: [0, TORSO_H], pivot: B(HEAD_H) });
for (const [s, side, sx] of [['L', 'upperArmL', -1], ['R', 'upperArmR', 1]]) {
  far.addPart({ key: side, tex: limbTex, w: 0.105, h: UPPER, parent: 'waist', anchor: [sx * 0.17, TORSO_H - 0.04], pivot: P(UPPER) });
}

/* 胯的高度：脚底到胯 = HIP + THIGH + SHIN + FOOT = 0.06+0.27+0.24+0.09 = 0.66m
 * 整身到头顶 = 0.66 + 0.30×2 + 0.06 + 0.32 = 1.64m
 * 幕布高 2.5m，下沿 -1.25。想让脚底停在 -1.12（不踩出画面），
 * 胯就取 BASE_Y = -1.12 + 0.66 = -0.46。
 * 投影放大率 ≈ 1.08，头顶影子约 1.64×1.08 - 1.12 ≈ 0.65 —— 落幅很舒服。 */
const BASE_Y = -0.46;
rig.root.position.set(-0.45, BASE_Y, -0.25);
far.root.position.set(1.30, BASE_Y, -0.95);
renderer.scene.add(rig.root);
renderer.scene.add(far.root);

/* ------------------------------------------------------------------ *
 * 4. 动作：直接按时间算关节角（真实项目里请换成关键帧/缓动时间轴）
 * ------------------------------------------------------------------ */
const DEG = Math.PI / 180;
const clock = document.getElementById('clock');
const scrub = document.getElementById('scrub');
const playBtn = document.getElementById('play');
const DURATION = 8;
let t = 0, playing = true;

/** 一个"抬手 → 停 → 放下"的循环，外加轻轻的重心起伏 */
function pose(at) {
  const c = (at % DURATION) / DURATION;             // 0..1
  // 抬起用快出缓入，落下慢 —— 让动作有轻重
  const lift = c < 0.25 ? (c / 0.25) ** 0.6
    : c < 0.55 ? 1
      : c < 0.85 ? 1 - ((c - 0.55) / 0.30) ** 1.6
        : 0;
  const sway = Math.sin(at * 1.1) * 3 * DEG;
  const breathe = Math.sin(at * 2.2) * 0.012;
  const step = Math.sin(at * 2.0);

  rig.setRootTransform(-0.45 + Math.sin(at * 0.35) * 0.10, BASE_Y + breathe, sway);
  rig.setPose({
    waist: [0, 0, Math.sin(at * 0.9) * 2 * DEG],
    chest: [0, 0, Math.sin(at * 0.9 + 0.4) * 2 * DEG],
    neck: [0, 0, Math.sin(at * 0.7) * 2 * DEG],
    head: [0, 0, Math.sin(at * 0.7) * 5 * DEG],
    // 右臂：抬起 2.2rad 到过顶，肘部跟着屈
    upperArmR: [0, 0, -2.2 * lift],
    forearmR: [0, 0, -0.5 * lift],
    handR: [0, 0, -0.2 * lift],
    // 左臂轻微配重
    upperArmL: [0, 0, 0.35 + 0.25 * lift],
    forearmL: [0, 0, 0.15],
    // 腿：缓慢交替迈步（不追求逼真，只为演示关节都在动）
    thighL: [0, 0, 0.22 * step], shinL: [0, 0, -0.18 * step],
    thighR: [0, 0, -0.22 * step], shinR: [0, 0, 0.18 * step],
    footL: [0, 0, 0.10 * step], footR: [0, 0, -0.10 * step],
  });

  far.setRootTransform(1.30 + Math.sin(at * 0.28 + 1.2) * 0.14, BASE_Y, 0);
  far.setPose({
    waist: [0, 0, Math.sin(at * 0.8) * 2 * DEG],
    head: [0, 0, Math.sin(at * 0.6 + 1) * 5 * DEG],
    upperArmL: [0, 0, 0.30 + Math.sin(at * 0.7) * 0.12],
    upperArmR: [0, 0, -0.30 - Math.sin(at * 0.9) * 0.12],
  });

  // 灯焰呼吸
  stage.setLight({ intensity: 2.55 + Math.sin(at * 3.3) * 0.06 });
}

function draw(dt) {
  rig.update(dt);
  far.update(dt);
  screen.update(dt, stage.light, renderer.camera);
  screen.renderShadow(renderer.scene);   // ★ 必须在主渲染之前，阴影贴图才有内容
  renderer.render(dt);
}

/* ------------------------------------------------------------------ *
 * 5. 主循环 + 自动化接口
 * ------------------------------------------------------------------ */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000) || 1 / 60;
  last = now;
  if (playing) t = (t + dt) % DURATION;
  pose(t);
  draw(dt);
  clock.textContent = t.toFixed(1) + 's';
  scrub.value = String(Math.round(t / DURATION * 1000));
}

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '▶ 播放' : '⏸ 暂停';
});
scrub.addEventListener('input', () => {
  playing = false;
  playBtn.textContent = '▶ 播放';
  t = parseFloat(scrub.value) / 1000 * DURATION;
  pose(t);
});

// 给自动化用的确定性接口（tools/probe.mjs / e2e.mjs 依赖它们）
window.__SET_TIME__ = (v) => { playing = false; t = v; pose(t); draw(1 / 60); return t; };
window.__STEP__ = (v) => { const n = 60; for (let i = 0; i < n; i++) { t += v / n; pose(t); draw(v / n); } return t; };
window.__PLAY__ = (on) => { playing = !!on; return playing; };
window.__qa = () => ({
  ready: true, t, duration: DURATION,
  casters: screen.shadowCasterCount,
  stats: renderer.stats(),
  webgl2: renderer.isWebGL2,
});
window.__snapshot = () => canvas.toDataURL('image/png');

// 调试句柄：方便在控制台/自动化里检查场景与骨架
window.__ENGINE__ = { renderer, scene: renderer.scene, camera: renderer.camera, stage, screen, rigs: { rig, far } };

pose(0);
requestAnimationFrame(loop);
window.__READY__ = true;
</script>
</body>
</html>
